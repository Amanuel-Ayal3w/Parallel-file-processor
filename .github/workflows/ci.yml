name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gofetl
          POSTGRES_PASSWORD: gofetl
          POSTGRES_DB: gofetl
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gofetl -d gofetl"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race ./...
        env:
          GOFETL_PG_URL: postgres://gofetl:gofetl@localhost:5432/gofetl?sslmode=disable
      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          "$(go env GOPATH)/bin/staticcheck" ./...
